services:
  postgres:
    image: postgres:16-alpine
    container_name: streamvibe-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: streamvibe
      POSTGRES_PASSWORD: streamvibe
      POSTGRES_DB: streamvibe
    ports:
      # 5434 снаружи: 5432 занят нативным PostgreSQL, 5433 — контейнером swift-postgres
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamvibe"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    container_name: streamvibe-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://streamvibe:streamvibe@postgres:5432/streamvibe?schema=public
      PORT: 4000
      FRONTEND_URL: http://localhost:3000
      KINOPOISK_API_KEY: ${KINOPOISK_API_KEY:-}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # NEXT_PUBLIC_* инлайнится при сборке — это адреса, которые видит браузер
        NEXT_PUBLIC_API_URL: http://localhost:4000/api
        NEXT_PUBLIC_WS_URL: http://localhost:4000
    container_name: streamvibe-web
    restart: unless-stopped
    environment:
      # SSR внутри docker-сети ходит в API по имени сервиса
      API_URL_INTERNAL: http://backend:4000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
